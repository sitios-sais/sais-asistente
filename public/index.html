<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sais</title>
    <!-- Librería para renderizar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Hoja de estilos separada -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <!-- Barra de Navegación Superior -->
        <header class="app-header">
            <div class="brand-container">
                <!-- Logotipo minimalista integrado -->
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="24" height="24" rx="6" fill="#2563EB"/>
                    <path d="M7 12L10 15L17 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-name">sais</span>
            </div>
            
            <div class="header-controls">
                <select id="modeloSelect" class="model-select">
                    <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
                    <option value="llama3-8b-8192">Llama 3 8B</option>
                </select>
            </div>
        </header>

        <div class="main-container">
            <!-- Menú Lateral / Panel de Historial -->
            <aside class="sidebar">
                <div class="sidebar-section-title">Control de Base de Datos</div>
                <div id="contadorTotal" class="counter-text">Mensajes guardados: 0</div>
                
                <div class="sidebar-menu">
                    <button class="menu-btn" onclick="cargarHistorial()">Actualizar Historial</button>
                    <button class="menu-btn btn-alt" onclick="exportarHistorial()">Exportar Chat (TXT)</button>
                    <button class="menu-btn btn-danger" onclick="limpiarBaseDatos()">Vaciar Base de Datos</button>
                </div>

                <div class="sidebar-section-title" style="margin-top: 24px;">Registros Almacenados</div>
                <div id="historial-container" class="history-list">
                    <div class="history-empty">Cargando registros...</div>
                </div>
            </aside>

            <!-- Área Principal del Chat -->
            <main class="chat-workspace">
                <div id="chatMensajes" class="chat-messages">
                    <div class="message assistant-message">
                        <div class="message-body">
                            <p>Sistema inicializado. Escribe un mensaje para comenzar.</p>
                        </div>
                    </div>
                </div>

                <div class="chat-input-wrapper">
                    <div class="chat-input-container">
                        <input type="text" id="inputMensaje" placeholder="Escribe tu mensaje aquí..." onkeypress="verificarEnter(event)">
                        <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script de lógica separado -->
    <script src="script.js"></script>
</body>
</html>
