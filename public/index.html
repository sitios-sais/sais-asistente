<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Personal IA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 80vh;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #3b82f6;
            padding: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .chat-mensajes {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensaje {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .mensaje.usuario {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }

        .mensaje.asistente {
            background: #334155;
            color: #f1f5f9;
            align-self: flex-start;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #3b82f6;
        }

        .chat-input-area button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <!-- Botón para ver el historial de MongoDB -->
<div style="margin-top: 20px; text-align: center;">
    <button onclick="cargarHistorial()" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Ver Historial de la Base de Datos
    </button>
</div>

<!-- Contenedor donde aparecerán los mensajes guardados -->
<div id="historial-container" style="margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px; max-width: 600px; margin-left: auto; margin-right: auto; text-align: left;"></div>

<script>
async function cargarHistorial() {
    try {
        const respuesta = await fetch('/api/historial');
        const datos = await respuesta.json();
        
        const contenedor = document.getElementById('historial-container');
        contenedor.innerHTML = '<h3>Historial guardado:</h3>';
        
        if (datos.length === 0) {
            contenedor.innerHTML += '<p>No hay mensajes guardados aún.</p>';
            return;
        }

        datos.forEach(item => {
            contenedor.innerHTML += `
                <div style="border-bottom: 1px solid #ddd; margin-bottom: 10px; padding-bottom: 5px;">
                    <p><strong>Tú:</strong> ${item.usuario}</p>
                    <p><strong>IA:</strong> ${item.respuesta}</p>
                    <small style="color: gray;">${new Date(item.fecha).toLocaleString()}</small>
                </div>
            `;
        });
    } catch (error) {
        console.error("Error al cargar historial:", error);
    }
}
</script>
    <div class="chat-container">
        <div class="chat-header">🤖 Mi Asistente Personal</div>
        
        <div id="chatMensajes" class="chat-mensajes">
            <div class="mensaje asistente">¡Hola! Soy tu asistente. ¿Qué comando o pregunta quieres probar hoy?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="inputMensaje" placeholder="Escribe un mensaje..." onkeypress="verificarEnter(event)">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById('inputMensaje');
            const texto = input.value.trim();

            if (texto === "") return;

            agregarMensajeAlChat(texto, 'usuario');
            input.value = "";

            try {
                const respuesta = await fetch('/api/asistente', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mensaje: texto })
                });

                const data = await respuesta.json();
                agregarMensajeAlChat(data.respuesta, 'asistente');

            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
                agregarMensajeAlChat("Lo siento, ocurrió un error de conexión con el servidor.", 'asistente');
            }
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                enviarMensaje();
            }
        }

        function agregarMensajeAlChat(texto, remitente) {
            const contenedorMensajes = document.getElementById('chatMensajes');
            const divMensaje = document.createElement('div');
            
            divMensaje.className = `mensaje ${remitente}`;
            divMensaje.innerText = texto;
            
            contenedorMensajes.appendChild(divMensaje);
            contenedorMensajes.scrollTop = contenedorMensajes.scrollHeight;
        }
    </script>
</body>
</html>
